<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signoff tests</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 32px; background: #f5f5f7; color: #1d1d1f; }
  .pass { color: #248a3d; } .fail { color: #d70015; font-weight: 600; }
  #summary { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  pre { margin: 2px 0 8px 18px; color: #515154; }
</style>
</head>
<body>
<div id="summary">Running…</div>
<div id="out"></div>
<script>
// Load the engine fresh on every run, so a browser cache never tests old code.
['config', 'templates', 'model', 'github', 'workspace', 'demo'].forEach(function (n) { document.write('<script src="../assets/' + n + '.js?t=' + Date.now() + '"><\/script>'); });
</script>
<script>
/* Unit tests for the model and the GitHub sync, run against a fake GitHub API.
   Open this file in a browser; the title shows PASS or FAIL. */
(async function () {
  var M = Signoff.model, results = [];
  function ok(cond, name, detail) { results.push({ ok: !!cond, name: name, detail: detail }); }
  function eq(a, b, name) { ok(JSON.stringify(a) === JSON.stringify(b), name, 'got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b)); }

  var T = window.SIGNOFF_TEMPLATES;
  var idx = M.indexTemplates(T);

  // ── Templates ──
  ok(T.length === 6, 'six templates bundled');
  var ids = {}, dup = [];
  T.forEach(function (t) { t.sections.forEach(function (s) { [s].concat(s.items).forEach(function (x) { if (ids[x.id]) dup.push(x.id); ids[x.id] = 1; }); }); });
  eq(dup, [], 'ids are unique across templates');
  ['sg1', 'adc1', 'pg1', 'ab1', 'gf1'].forEach(function (id) { ok(idx.items[id], 'legacy id ' + id + ' still present'); });
  var newer = JSON.parse(JSON.stringify(T[0])); newer.version = T[0].version + 1; newer.title = 'Pulled';
  eq(M.resolveTemplates(T, [newer])[0].title, 'Pulled', 'pulled template with higher version wins');
  var older = JSON.parse(JSON.stringify(T[0])); older.version = 0; older.title = 'Old';
  eq(M.resolveTemplates(T, [older])[0].title, T[0].title, 'bundled template wins over an older pulled one');

  // ── Roles: FTE, client, contractor ──
  (function () {
    var r = M.emptyRoster();
    r.users = { zed: { login: 'zed', name: 'Zed', role: 'contractor' }, amy: { login: 'amy', name: 'Amy', role: 'client' },
      bo: { login: 'bo', name: 'Bo', role: 'fte' }, cy: { login: 'cy', name: 'Cy', role: 'client', deleted: true } };
    eq(M.liveUsers(r).map(function (u) { return u.login; }), ['bo', 'amy', 'zed'], 'People lists FTEs, then clients, then contractors');
    ok(M.isOutside(r.users.amy) && M.isOutside(r.users.zed) && !M.isOutside(r.users.bo) && !M.isOutside(r.users.cy), 'clients and contractors are outside the team; FTEs and removed people aren’t');
  })();

  // ── Config ──
  var CFG = Signoff.config;
  eq(M.TAGS.map(function (t) { return t.id; }), CFG.tags.map(function (t) { return t.id; }), 'profile tags come from config.js');
  ok(M.newProject({ name: 'x', checklists: [] }, 'Ann', T).id.indexOf(CFG.ids.project) === 0, 'project ids use the configured prefix');
  ok(CFG.storage.ns !== 'signoff.' && CFG.repos.prefix !== 'review-', 'own storage namespace and shared-repo prefix');

  // ── Applicability ──
  ok(M.applies([], []), 'untagged applies');
  ok(!M.applies(['rf'], ['battery']), 'tagged item hidden outside profile');
  ok(M.applies(['rf', 'mains'], ['mains']), 'any matching tag applies');
  var p = M.newProject({ name: 'Test Board', checklists: ['schematic'], profile: [] }, 'Ann', T);
  var rows = []; M.checklistRows(p, T[0]).forEach(function (g) { rows = rows.concat(g.rows); });
  var hidden = rows.filter(function (r) { return r.hidden; });
  ok(hidden.length > 0 && hidden.every(function (r) { return r.status === 'na' && r.auto === 'profile'; }), 'profile-hidden rows count as N/A');
  p.items[hidden[0].id] = { include: true };
  var r2 = []; M.checklistRows(p, T[0]).forEach(function (g) { r2 = r2.concat(g.rows); });
  eq(r2.filter(function (r) { return r.id === hidden[0].id; })[0].status, 'open', 'include brings a hidden item back');
  p.items[hidden[0].id] = { status: 'pass' };
  var r3 = []; M.checklistRows(p, T[0]).forEach(function (g) { r3 = r3.concat(g.rows); });
  eq(r3.filter(function (r) { return r.id === hidden[0].id; })[0].status, 'pass', 'explicit status overrides profile');
  var st = M.projectStats(p, T);
  ok(st.total === rows.length - hidden.length + 1 && st.outside === hidden.length - 1 && st.reviewed === 1, 'profile-hidden items are left out of progress (a passed one counts)');
  var fresh = M.newProject({ name: 'Fresh', checklists: ['schematic', 'pcb'], profile: ['battery'] }, 'Ann', T);
  eq(M.projectStats(fresh, T).pct, 0, 'a new review starts at 0%');
  var bare = M.newProject({ name: 'Bare', checklists: [] }, 'ann', T);
  eq([M.projectStats(bare, T).pct, M.projectSummary(bare, T).pct], [100, 100], 'a review with nothing to review is 100% (requirements only, or no checks)');

  // ── Merge ──
  var base = M.newProject({ name: 'Merge', checklists: ['schematic'] }, 'Ann', T);
  var a = JSON.parse(JSON.stringify(base)), b = JSON.parse(JSON.stringify(base));
  a.items.sg1 = { status: 'pass', updatedAt: '2026-01-01T10:00:00Z', updatedBy: 'Ann' };
  b.items.sg1 = { status: 'issue', updatedAt: '2026-01-01T11:00:00Z', updatedBy: 'Bob' };
  a.items.sg2 = { status: 'pass', updatedAt: '2026-01-01T10:00:00Z', updatedBy: 'Ann' };
  b.comments.c1 = { id: 'c1', item: 'sg1', author: 'Bob', text: 'hi', at: 'x', updatedAt: '2026-01-01T11:00:00Z', updatedBy: 'Bob' };
  a.comments.c2 = { id: 'c2', item: 'sg1', author: 'Ann', text: 'yo', at: 'x', updatedAt: '2026-01-01T09:00:00Z', updatedBy: 'Ann' };
  var m1 = M.mergeProjects(a, b), m2 = M.mergeProjects(b, a);
  eq(m1.items.sg1.status, 'issue', 'newer item state wins');
  ok(m1.items.sg2 && m1.comments.c1 && m1.comments.c2, 'both sides’ items and comments kept');
  eq(M.stableStringify(m1), M.stableStringify(m2), 'merge is order independent');
  var del = JSON.parse(JSON.stringify(m1)); del.comments.c1 = Object.assign({}, del.comments.c1, { deleted: true, updatedAt: '2026-01-02T00:00:00Z' });
  ok(M.mergeProjects(m1, del).comments.c1.deleted, 'deletion tombstone survives merge');
  eq(M.stableStringify({ b: 1, a: { d: 1, c: 2 } }), '{\n  "a": {\n    "c": 2,\n    "d": 1\n  },\n  "b": 1\n}\n', 'stable stringify sorts keys');

  // ── Legacy import ──
  var legacy = { version: '3.0', projectName: 'Old Board', categories: [[{ id: 's-gen', items: [{ id: 'sg1', text: 'x' }, { id: 'zz9', text: 'My own check', note: 'n' }] }], [], [], [], []],
    checks: [{ sg1: true, sg2: 'na', sg3: false }, {}, {}, {}, {}], sectionNA: [{}, { 'if-adc': true }, {}, {}, {}] };
  ok(M.isLegacy(legacy) === !!(CFG.legacyTabs || []).length, 'legacy export detected (EE only)');
  var lp = M.importLegacy(legacy, 'Ann', T);
  eq([lp.meta.name, lp.items.sg1.status, lp.items.sg2.status, !!lp.items.sg3, lp.sections['if-adc'].na, lp.custom.zz9.text, lp.custom.zz9.section],
    ['Old Board', 'pass', 'na', false, true, 'My own check', 's-gen'], 'legacy import maps checks, N/A, sections and custom items');

  // ── Another tab (or Fabcheck's "Send to Signoff") wrote our working copies ──
  var mine = M.newProject({ name: 'Shared Tab', checklists: [T[0].id] }, 'Ann', T);
  mine.slug = 'shared-tab';
  var theirsDoc = JSON.parse(JSON.stringify(mine));
  mine.items.q1 = { status: 'pass', updatedAt: '2026-10-24T10:00:00Z', updatedBy: 'Ann' };
  theirsDoc.custom.xfab1 = { id: 'xfab1', checklist: T[0].id, section: T[0].sections[0].id, text: 'Annular ring 0.05 mm on H3', severity: 'major',
    source: { tool: 'fabcheck', check: 'annular-ring', gone: false }, createdAt: '2026-10-24T11:00:00Z', updatedAt: '2026-10-24T11:00:00Z', updatedBy: 'Fabcheck' };
  theirsDoc.items.xfab1 = { status: 'issue', updatedAt: '2026-10-24T11:00:00Z', updatedBy: 'Fabcheck' };
  theirsDoc.comments.cfab1 = { id: 'cfab1', item: 'xfab1', author: 'Fabcheck', at: '2026-10-24T11:00:00Z', text: 'From Fabcheck', updatedAt: '2026-10-24T11:00:00Z', updatedBy: 'Fabcheck' };
  var other = M.newProject({ name: 'Only Theirs', checklists: [T[0].id] }, 'Bob', T);
  other.slug = 'shared-tab';   // same slug, different project
  var ext = M.mergeLocalCopies({ 'shared-tab': mine }, { 'shared-tab': theirsDoc, 'renamed-there': other });
  var got = ext.projects['shared-tab'];
  ok(ext.changed && got.items.q1 && got.items.xfab1.status === 'issue' && got.comments.cfab1, 'an external write merges with local edits instead of replacing them');
  eq(got.custom.xfab1.source, { tool: 'fabcheck', check: 'annular-ring', gone: false }, 'the Fabcheck source field survives the merge');
  ok(ext.projects['renamed-there'] && ext.projects['renamed-there'].id === other.id && Object.keys(ext.projects).length === 2, 'projects match by id, not slug');
  ok(!M.mergeLocalCopies(ext.projects, { 'shared-tab': theirsDoc }).changed, 'nothing new from the other tab means no write back');
  eq(M.mergeProjects(got, theirsDoc).custom.xfab1.source.tool, 'fabcheck', 'mergeProjects passes the source field through');

  // ── Token fingerprint (how each tool notices the shared token changed) ──
  var tagA = M.tokenTag('ghp_example_token_a');
  ok(/^[0-9a-f]{8}$/.test(tagA) && tagA === M.tokenTag('ghp_example_token_a') && tagA !== M.tokenTag('ghp_example_token_b') && tagA.indexOf('ghp') < 0,
    'a token fingerprint is short, stable, differs between tokens and doesn’t contain the token');

  // ── Git blob sha ──
  eq(await Signoff.github.gitBlobSha('hello\n'), 'ce013625030ba8dba906f756967f9e9ca394464a', 'git blob sha matches git hash-object');

  // ── A fake GitHub with several repositories, users and permissions ──
  // Tokens: 'tok-<login>'. 'ann' owns every repository (personal account).
  function FakeHub() {
    var hub = this;
    hub.repos = {}; hub.n = 0; hub.calls = []; hub.inviteSeq = 1; hub.raceOnce = null;
    function id() { return (++hub.n).toString(16).padStart(40, '0'); }
    function commitFiles(repo, files) {
      var t = id(); repo.trees[t] = files; var c = id(); repo.commits[c] = { tree: t, parent: repo.head }; repo.head = c; return c;
    }
    hub.makeRepo = function (full, files, members) {
      hub.repos[full] = { trees: {}, commits: {}, head: null, blobs: {}, collaborators: (members || []).slice(), invitations: [] };
      commitFiles(hub.repos[full], files);
    };
    hub.files = function (full) { var r = hub.repos[full]; return Object.assign({}, r.trees[r.commits[r.head].tree]); };
    hub.push = function (full, files) { commitFiles(hub.repos[full], files); };
    hub.fetchFor = function (token) {
      var login = token.replace(/^tok-/, '');
      return async function (url, opts) {
        var u = url.replace('https://api.github.com', ''), method = opts.method || 'GET';
        var body = opts.body ? JSON.parse(opts.body) : null;
        hub.calls.push(login + ' ' + method + ' ' + u);
        function res(status, data) { return { ok: status < 300, status: status, text: async function () { return data === undefined ? '' : JSON.stringify(data); } }; }
        if (u === '/user') return res(200, { login: login, name: login.toUpperCase() });
        if (/^\/users\//.test(u)) return res(200, { login: u.split('/')[2], type: 'User' });
        if (/^\/user\/repos\?/.test(u) && method === 'GET') {
          return res(200, Object.keys(hub.repos).filter(function (f) { return hub.repos[f].collaborators.indexOf(login) >= 0; })
            .map(function (f) { return { name: f.split('/')[1], owner: { login: f.split('/')[0] } }; }));
        }
        if (u === '/user/repos' && method === 'POST') {
          var full = login + '/' + body.name;
          if (hub.repos[full]) return res(422, { message: 'name already exists on this account' });
          hub.makeRepo(full, { 'README.md': '# ' + body.name }, [login]);
          return res(201, { full_name: full });
        }
        if (/^\/user\/repository_invitations\?/.test(u)) {
          var mine = [];
          Object.keys(hub.repos).forEach(function (f) {
            hub.repos[f].invitations.forEach(function (i) { if (i.login === login) mine.push({ id: i.id, repository: { full_name: f, owner: { login: f.split('/')[0] } } }); });
          });
          return res(200, mine);
        }
        var acc = /^\/user\/repository_invitations\/(\d+)$/.exec(u);
        if (acc && method === 'PATCH') {
          Object.keys(hub.repos).forEach(function (f) {
            var r = hub.repos[f];
            r.invitations.filter(function (i) { return String(i.id) === acc[1] && i.login === login; }).forEach(function () { r.collaborators.push(login); });
            r.invitations = r.invitations.filter(function (i) { return String(i.id) !== acc[1]; });
          });
          return res(204);
        }
        var m = /^\/repos\/([^/]+)\/([^/]+)(\/.*)$/.exec(u.split('?')[0]);
        if (!m) return res(404, { message: 'Not Found: ' + u });
        var full2 = m[1] + '/' + m[2], repo = hub.repos[full2], path = m[3];
        if (!repo || repo.collaborators.indexOf(login) < 0) return res(404, { message: 'Not Found' });
        var admin = full2.split('/')[0] === login;
        if (method === 'GET' && /^\/git\/ref\/heads\//.test(path)) return res(200, { object: { sha: repo.head } });
        if (method === 'GET' && /^\/git\/commits\//.test(path)) return res(200, { tree: { sha: repo.commits[path.split('/').pop()].tree } });
        if (method === 'GET' && /^\/git\/trees\//.test(path)) {
          var files = repo.trees[path.split('/').pop()];
          var entries = await Promise.all(Object.keys(files).map(async function (p) {
            var v = files[p], s = typeof v === 'string' ? await Signoff.github.gitBlobSha(v) : await Signoff.github.gitBlobShaBytes(v);
            repo.blobs[s] = v; return { path: p, type: 'blob', sha: s, size: typeof v === 'string' ? v.length : v.length };
          }));
          return res(200, { tree: entries });
        }
        if (method === 'GET' && /^\/git\/blobs\//.test(path)) {
          var bv = repo.blobs[path.split('/').pop()];
          return res(200, { content: typeof bv === 'string' ? Signoff.github.b64Encode(bv) : Signoff.github.bytesToB64(bv) });
        }
        if (method === 'POST' && path === '/git/blobs') {
          var raw = Signoff.github.b64ToBytes(body.content), bs = await Signoff.github.gitBlobShaBytes(raw);
          repo.blobs[bs] = raw; hub.blobPosts = (hub.blobPosts || 0) + 1; return res(201, { sha: bs });
        }
        if (method === 'POST' && path === '/git/trees') {
          var f = Object.assign({}, repo.trees[body.base_tree]);
          body.tree.forEach(function (e) { if (e.sha === null) delete f[e.path]; else if (e.sha) f[e.path] = repo.blobs[e.sha]; else f[e.path] = e.content; });
          var t = id(); repo.trees[t] = f; return res(201, { sha: t });
        }
        if (method === 'POST' && path === '/git/commits') { var cs = id(); repo.commits[cs] = { tree: body.tree, parent: body.parents[0] }; return res(201, { sha: cs, html_url: 'https://github.com/' + full2 + '/commit/' + cs }); }
        if (method === 'PATCH' && /^\/git\/refs\/heads\//.test(path)) {
          if (hub.raceOnce) { var race = hub.raceOnce; hub.raceOnce = null; race(); }
          if (repo.commits[body.sha].parent !== repo.head) return res(422, { message: 'Update is not a fast forward' });
          repo.head = body.sha; return res(200, {});
        }
        if (!admin && /^\/(collaborators|invitations)/.test(path)) return res(403, { message: 'Must have admin rights' });
        if (method === 'GET' && path === '/collaborators') return res(200, repo.collaborators.map(function (l) { return { login: l }; }));
        if (method === 'GET' && path === '/invitations') return res(200, repo.invitations.map(function (i) { return { id: i.id, invitee: { login: i.login } }; }));
        var col = /^\/collaborators\/(.+)$/.exec(path);
        if (col && method === 'PUT') {
          if (repo.collaborators.indexOf(col[1]) < 0 && !repo.invitations.some(function (i) { return i.login === col[1]; })) repo.invitations.push({ id: hub.inviteSeq++, login: col[1] });
          return res(201, {});
        }
        if (col && method === 'DELETE') { repo.collaborators = repo.collaborators.filter(function (l) { return l !== col[1]; }); return res(204); }
        var inv = /^\/invitations\/(\d+)$/.exec(path);
        if (inv && method === 'DELETE') { repo.invitations = repo.invitations.filter(function (i) { return String(i.id) !== inv[1]; }); return res(204); }
        return res(404, { message: 'Not Found: ' + method + ' ' + path });
      };
    };
  }

  var hub = new FakeHub();
  hub.makeRepo('ann/tool', { 'index.html': '<html>', 'assets/version.js': "window.SIGNOFF_VERSION = { hash: 'abc123', date: '2026-10-23' };" }, ['ann']);
  hub.makeRepo('ann/data', { 'README.md': '# data' }, ['ann']);
  var SET = { owner: 'ann', toolRepo: 'tool', dataRepo: 'data', dataPath: '', prefix: 'review-', branch: 'main', suiteRepos: ['other_tool', 'other_data', 'signoff'] };
  function wsFor(login, extra) { return new Signoff.Workspace(Object.assign({}, SET, extra || {}), 'tok-' + login, hub.fetchFor('tok-' + login)); }
  function blank() { return { login: '', projects: {}, roster: M.emptyRoster(), homes: {}, cache: {}, dataAccess: '' }; }
  function dataFile(id) { return hub.files('ann/data')['projects/' + id + '.json']; }

  // Ann (owner) creates an internal project.
  var annWs = wsFor('ann'), annSt = blank();
  var P = M.newProject({ name: 'Sensor Hub Main Board', checklists: ['schematic'] }, 'ann', T);
  annSt.projects[P.id] = P;
  var r = await annWs.sync(annSt, {});
  annSt = r.state;
  ok(r.errors.length === 0 && annSt.dataAccess === 'ok' && annSt.login === 'ann', 'owner syncs as FTE', JSON.stringify(r.errors));
  ok(dataFile(P.id), 'internal project is written to the data repo');
  eq(r.version && r.version.hash, 'abc123', 'tool version read from the tool repo');
  ok(!Object.keys(hub.files('ann/data')).some(function (p) { return /sensor/i.test(p); }), 'file names don’t reveal project names');

  // People: Bob is an FTE, Cat a contractor on P.
  var now = '2026-10-23T14:00:00Z';
  annSt.roster.users.bob = { login: 'bob', name: 'Bob', role: 'fte', projects: [], updatedAt: now, updatedBy: 'ann' };
  annSt.roster.users.cat = { login: 'cat', name: 'Cat', role: 'contractor', projects: [P.id], updatedAt: now, updatedBy: 'ann' };
  r = await annWs.sync(annSt, {}); annSt = r.state;
  ok(JSON.parse(hub.files('ann/data')['users.json']).users.cat, 'People list is saved in the data repo');

  // Before accepting, Bob can't open the data repo: no local data, so he looks like a contractor.
  hub.repos['ann/data'].invitations.push({ id: 900, login: 'bob' });
  hub.repos['ann/tool'].invitations.push({ id: 901, login: 'bob' });
  var bobWs = wsFor('bob'), bobSt = blank();
  r = await bobWs.sync(bobSt, {});
  ok(r.state.dataAccess === 'none' && r.invitations.length === 2, 'invitations are listed before they’re accepted');
  await Promise.all(r.invitations.map(function (i) { return bobWs.account.acceptInvitation(i.id); }));
  r = await bobWs.sync(r.state, {}); bobSt = r.state;
  ok(bobSt.dataAccess === 'ok' && bobSt.projects[P.id], 'after accepting, the FTE sees internal projects');

  // Bob edits P but doesn't sync. Meanwhile Ann shares P with Cat.
  bobSt.projects[P.id] = JSON.parse(JSON.stringify(bobSt.projects[P.id]));
  bobSt.projects[P.id].items.sg1 = { status: 'issue', updatedAt: '2026-10-23T15:00:00Z', updatedBy: 'bob' };
  var sh = await annWs.share(annSt, P.id, ['cat']);
  annSt = sh.state;
  eq(sh.repo, 'ann/review-sensor-hub-main-board', 'sharing creates a private review- repository');
  ok(hub.files(sh.repo)['projects/' + P.id + '.json'], 'the project is copied into it');
  ok(hub.repos[sh.repo].invitations.some(function (i) { return i.login === 'cat'; }) && hub.repos[sh.repo].invitations.some(function (i) { return i.login === 'bob'; }),
    'the contractor and the other FTEs are invited');
  r = await annWs.sync(annSt, {}); annSt = r.state;
  ok(!dataFile(P.id) && JSON.parse(hub.files('ann/data')['users.json']).shared[P.id].repo === sh.repo, 'the data repo records the move and drops its copy');

  // Bob syncs his stale edit: it must not resurrect P in the data repo.
  r = await bobWs.sync(bobSt, {}); bobSt = r.state;
  ok(!dataFile(P.id), 'an unsynced edit doesn’t bring a shared project back into the data repo');
  ok(bobSt.projects[P.id] && bobSt.projects[P.id].items.sg1 && r.errors.some(function (e) { return e.repo === sh.repo; }), 'until Bob accepts, his edit is kept locally and the repo is reported');
  var bInv = (await bobWs.account.invitations()).filter(function (i) { return i.repo === sh.repo; })[0];
  await bobWs.account.acceptInvitation(bInv.id);
  r = await bobWs.sync(bobSt, {}); bobSt = r.state;
  ok(JSON.parse(hub.files(sh.repo)['projects/' + P.id + '.json']).items.sg1 && !dataFile(P.id), 'after accepting, his edit lands in the shared repo');

  // Cat: a contractor sees only her project and never touches the data repo.
  var catWs = wsFor('cat'), catSt = blank();
  r = await catWs.sync(catSt, {});
  ok(r.state.dataAccess === 'none' && !Object.keys(r.state.projects).length && r.invitations.length === 1, 'contractor starts with an invitation and nothing else');
  await catWs.account.acceptInvitation(r.invitations[0].id);
  var Q = M.newProject({ name: 'Secret Internal', checklists: ['schematic'] }, 'ann', T);
  annSt.projects[Q.id] = Q;
  r = await annWs.sync(annSt, {}); annSt = r.state;
  var dataCalls = hub.calls.length;
  r = await catWs.sync(blank(), {}); catSt = r.state;
  eq(Object.keys(catSt.projects), [P.id], 'contractor gets only the shared project');
  ok(!hub.calls.slice(dataCalls).some(function (c) { return /^cat .*\/repos\/ann\/data\/git\/blobs/.test(c); }), 'contractor downloads nothing from the data repo');
  catSt.projects[P.id] = JSON.parse(JSON.stringify(catSt.projects[P.id]));
  catSt.projects[P.id].comments.k1 = { id: 'k1', item: 'sg1', author: 'Cat', text: 'Fixed in rev B', at: 'x', updatedAt: '2026-10-23T16:00:00Z', updatedBy: 'cat' };
  r = await catWs.sync(catSt, {}); catSt = r.state;
  ok(JSON.parse(hub.files(sh.repo)['projects/' + P.id + '.json']).comments.k1, 'contractor changes reach the single source of truth');

    var b2 = {}; M.specAnalysis(ep).sections.forEach(function (x) { b2[x.sec.title] = x; });
    eq([M.specUsesItems(b2.Buck.sec.body, 'Supplies')[0], M.specUsesItems(b2.USB.sec.body, 'Connects')[0]], [{ name: 'Controller', label: '3V3' }, { name: 'Controller', label: 'USB' }], 'a rename follows into every link word and keeps the signal');
    var add = M.specAddBlock(ep, { title: 'LDO', kind: 'power', parent: b2.Buck.sec.id, label: '1V8' }, 'Ann'); put(add);
    eq(M.specUsesItems(ep.spec[b2.Buck.sec.id].body, 'Supplies').pop(), { name: 'LDO', label: '1V8' }, 'a block added under a power block is supplied by it, with its rail');
    var add2 = M.specAddBlock(ep, { title: 'ESD', kind: 'connector', parent: b2.USB.sec.id }, 'Ann'); put(add2);
    eq(M.specUsesNames(ep.spec[b2.USB.sec.id].body, 'Connects').pop(), 'ESD', 'a block added under another is connected from it');
    eq(M.specKindLink('power') + '/' + M.specKindLink('processor'), 'Supplies/Connects', 'a power block’s new links supply; others connect');
    ok(M.specMarkdown(ep).indexOf('*Supplies: Controller (3V3), Relays (5V), LDO (1V8)*') > 0 && M.specMarkdown(ep).indexOf('*Parts: U7, L1, C1–C3*') > 0, 'the Markdown export keeps link and Parts lines', M.specMarkdown(ep));
  })();
  // Sections (EE, no kinds): nesting, grouping, ungrouping, and kept positions.
  (function () {
    window.SIGNOFF_CONFIG.spec = { label: 'Description', layout: 'flow', parts: true, kinds: [], links: ['Connects', 'Supplies'] };
    eq([M.specKinds(), M.specHeading('## Buck * power').title], [[], 'Buck * power'], 'with no kinds, a starred word stays in the title');
    var sp = M.newProject({ name: 'Sections', checklists: [], profile: [] }, 'Ann', T), put = function (recs) { recs.forEach(function (r) { sp.spec[r.id] = r; }); };
    sp.spec = {};
    put(M.specSave(sp, null, '# Board\n## Power\n### Buck\nSupplies: MCU (3V3)\n### LDO\n## MCU\nRuns.\n## LEDs', 'Ann'));
    var id = function (t) { return M.liveSpec(sp).filter(function (x) { return x.title === t; })[0].id; };
    var shape = function () { return M.liveSpec(sp).map(function (x) { return x.level + x.title; }).join(' '); };
    eq(shape(), '1Board 2Power 3Buck 3LDO 2MCU 2LEDs', 'headings set up');
    put(M.specNest(sp, [id('LEDs')], id('Power'), 'Ann'));
    eq(shape(), '1Board 2Power 3Buck 3LDO 3LEDs 2MCU', 'specNest moves a block to the end of a section, one level under it');
    put(M.specNest(sp, [id('LEDs')], null, 'Ann'));
    eq(shape(), '1Board 2Power 3Buck 3LDO 2MCU 2LEDs', 'specNest with no section moves it out, under the board');
    eq(M.specNest(sp, [id('Power')], id('Buck'), 'Ann'), [], 'a section never moves into itself');
    var g = M.specGroup(sp, [id('MCU'), id('LEDs')], 'Control', 'Ann'); put(g);
    eq(shape(), '1Board 2Power 3Buck 3LDO 2Control 3MCU 3LEDs', 'specGroup makes a section where the first block was, with the blocks under it');
    put(M.specNest(sp, [id('Control')], id('Power'), 'Ann'));
    eq(shape(), '1Board 2Power 3Buck 3LDO 3Control 4MCU 4LEDs', 'a section nests with everything in it');
    put(M.specNest(sp, [id('LEDs')], id('Control'), 'Ann', id('MCU')));
    eq(shape(), '1Board 2Power 3Buck 3LDO 3Control 4LEDs 4MCU', 'specNest with a heading to go before reorders inside a section');
    put(M.specNest(sp, [id('Control')], null, 'Ann', id('Power')));
    eq(shape(), '1Board 2Control 3LEDs 3MCU 2Power 3Buck 3LDO', 'a section moves before another at the top level');
    put(M.specNest(sp, [id('Control')], id('Power'), 'Ann'));
    put(M.specUngroup(sp, id('Control'), 'Ann'));
    eq(shape(), '1Board 2Power 3Buck 3LDO 3LEDs 3MCU', 'specUngroup moves its blocks up a level and drops an empty section heading');
    sp.spec[id('MCU')] = Object.assign({}, sp.spec[id('MCU')], { pos: { x: 120.4, y: 'bad' } });
    eq(M.liveSpec(sp).filter(function (x) { return x.title === 'MCU'; })[0].pos, null, 'a position must be two numbers');
    sp.spec[id('MCU')] = Object.assign({}, sp.spec[id('MCU')], { pos: { x: 120.4, y: 80 } });
    put(M.specSave(sp, id('MCU'), '### MCU\nRuns the board.', 'Ann'));
    put(M.specSaveAll(sp, M.specToText(sp).replace('### LEDs', '### Status LEDs'), 'Ann'));
    eq(M.liveSpec(sp).filter(function (x) { return x.title === 'MCU'; })[0].pos, { x: 120, y: 80 }, 'a block keeps its place through edits and Edit all');
  })();
  window.SIGNOFF_CONFIG.spec = TOOL_SPEC;

  var failed = results.filter(function (r) { return !r.ok; });
  document.getElementById('out').innerHTML = results.map(function (r) {
    return '<div class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? '✓ ' : '✗ ') + r.name + '</div>' + (r.ok ? '' : '<pre>' + (r.detail || '') + '</pre>');
  }).join('');
  document.getElementById('summary').textContent = (failed.length ? 'FAIL: ' + failed.length + ' of ' : 'PASS: all ') + results.length + ' tests';
  document.title = failed.length ? 'FAIL' : 'PASS';
})().catch(function (e) {
  document.getElementById('summary').textContent = 'ERROR: ' + e.message;
  document.title = 'ERROR';
  console.error(e);
});
</script>
</body>
